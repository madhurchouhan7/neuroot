<body class="font-body-ui text-bloom-white min-h-screen flex flex-col relative w-full max-w-[390px] mx-auto overflow-x-hidden antialiased">
<!-- Status Bar Placeholder -->
<div class="h-height-status-bar w-full flex justify-between items-center px-6 pt-2 text-sm font-semibold z-50">
<span>9:41 PM</span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
</div>
</div>
<!-- Top Bar (Suppressed shared TopAppBar for contextual override) -->
<div class="h-height-top-bar w-full flex items-center justify-between px-screen-padding shrink-0">
<button class="flex items-center gap-1 text-[#6B6560] hover:text-bloom-white transition-colors">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span class="font-body-ui text-[13px] font-medium">Exit</span>
</button>
<div class="text-[#6B6560] font-body-ui text-[11px] font-bold uppercase tracking-[0.15em]">FOCUS MODE</div>
<button class="text-[#6B6560] hover:text-bloom-white transition-colors">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
</div>
<main class="flex-1 flex flex-col items-center w-full px-screen-padding pb-6 overflow-y-auto">
<!-- Mascot & Growth Area -->
<div class="w-full flex flex-col items-center mt-2 relative">
<div class="text-[#6B6560] font-body-ui text-[11px] font-semibold uppercase tracking-wider mb-2">SPROUT IS FOCUSED!</div>
<div class="relative w-[180px] h-[180px] flex items-center justify-center">
<!-- Ambient Glow -->
<div class="absolute inset-0 bg-[#4CAF82] rounded-full blur-[40px] opacity-20"></div>
<img alt="" class="relative z-10 w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXNerXP1G6X3A4IkM1-sZgIDU5pg_S9Mqid8sIA3oJQngA4P3lp9fiM8n8UPRxAa5Pu58pUIZDfdD0Dh6v84a9mtjuHMHMUdNzPLD73L4GzSjQ77sKanNmqkLILdcft4TFhXw5NnjUj52B8uOnuADfelGENWzX68vuzHh8RGZB8FWU-d12LSgvPUrkTowzuWqowSQtA4VIexr0VF5QUfh27OnxE9mInIqSy-c2kd-pskjBvPetgDWdQ3_c7sfHG9LnmiWe1jgT53o"/>
</div>
</div>
<!-- Task Info -->
<div class="flex flex-col items-center mt-6 text-center">
<div class="text-[#6B6560] font-body-ui text-[11px] font-bold uppercase tracking-[0.12em] mb-1">STUDYING</div>
<div class="font-screen-title text-[20px] text-bloom-white">DSA Practice — Trees</div>
</div>
<!-- Timer Circle -->
<div class="relative w-[200px] h-[200px] mt-8 flex items-center justify-center">
<!-- Background Track -->
<svg class="absolute w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="#2A2620" stroke-width="6"></circle>
<!-- Progress Track (65% of circumference 2 * pi * 45 ≈ 282.7. 65% ≈ 183.7) -->
<circle cx="50" cy="50" fill="none" r="45" stroke="#f6c945" stroke-dasharray="282.7" stroke-dashoffset="99" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="relative z-10 flex flex-col items-center">
<div class="font-stats-lg text-[44px] text-bloom-white tracking-tight">18:33</div>
<div class="font-body-ui text-[11px] font-semibold text-[#6B6560] uppercase tracking-wider mt-1">Focus</div>
</div>
</div>
<!-- Mode Pills -->
<div class="flex items-center gap-2 mt-8">
<button class="px-4 py-1.5 rounded-full bg-[#2A2620] text-primary-container font-body-ui text-[13px] font-medium border border-transparent">25/5</button>
<button class="px-4 py-1.5 rounded-full bg-transparent text-[#6B6560] font-body-ui text-[13px] font-medium border border-[#2A2620]">50/10</button>
<button class="px-4 py-1.5 rounded-full bg-transparent text-[#6B6560] font-body-ui text-[13px] font-medium border border-[#2A2620]">Custom</button>
</div>
<!-- Controls -->
<div class="flex items-center justify-center gap-6 mt-8">
<button class="w-12 h-12 rounded-full bg-[#2A2620] flex items-center justify-center text-bloom-white hover:bg-opacity-80 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">replay</span>
</button>
<button class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-[#1C1A16] hover:bg-primary-fixed-dim transition-colors shadow-[0_4px_20px_rgba(246,201,69,0.3)]">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-12 h-12 rounded-full bg-[#2A2620] flex items-center justify-center text-bloom-white hover:bg-opacity-80 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
</div>
<!-- Stats Row -->
<div class="grid grid-cols-3 gap-3 w-full mt-10">
<div class="bg-bloom-night-card rounded-2xl p-4 flex flex-col items-center justify-center border border-[#302D29]">
<div class="font-stats-lg text-[22px] text-bloom-white mb-1">3</div>
<div class="font-body-ui text-[10px] font-semibold text-[#6B6560] uppercase tracking-wider">Sessions</div>
</div>
<div class="bg-bloom-night-card rounded-2xl p-4 flex flex-col items-center justify-center border border-[#302D29]">
<div class="font-stats-lg text-[22px] text-bloom-white mb-1">1.2h</div>
<div class="font-body-ui text-[10px] font-semibold text-[#6B6560] uppercase tracking-wider">Deep Work</div>
</div>
<div class="bg-bloom-night-card rounded-2xl p-4 flex flex-col items-center justify-center border border-[#302D29]">
<div class="font-stats-lg text-[22px] text-bloom-white mb-1">12</div>
<div class="font-body-ui text-[10px] font-semibold text-[#6B6560] uppercase tracking-wider">Day Streak</div>
</div>
</div>
<!-- Distraction Toast -->
<div class="w-full bg-bloom-night-card rounded-xl p-4 mt-8 flex flex-col items-center text-center border border-[#302D29] shadow-lg">
<div class="font-body-ui text-sm text-bloom-white mb-3">🌱 Want to keep focusing? You're doing great!</div>
<button class="font-body-ui text-sm font-semibold text-primary-container flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">check</span>
        Yes
      </button>
</div>
<!-- End Session Ghost Button -->
<button class="mt-8 font-body-ui text-[12px] font-medium text-[#4A4540] hover:text-bloom-white transition-colors">
      × End Session
    </button>
</main>
</body></html>
