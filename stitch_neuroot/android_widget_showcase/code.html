</div>
<div class="flex items-center gap-2">

<span class="text-bloom-white text-xs truncate">DSA Practice</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-bloom-white/30" style="font-variation-settings: 'FILL' 0;">radio_button_unchecked</span>
<span class="text-bloom-white text-xs truncate">CN Revision</span>
</div>
</div>
<div class="mt-auto pt-2">
<div class="h-1 w-full bg-bloom-white/10 rounded-full overflow-hidden">

</div>
</div>
</div>

</div>

</svg>

</div>
<div class="flex flex-col items-center justify-center gap-1">
