<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bloom - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Nunito+Sans:ital,wght@0,600;0,700;1,600&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e4e2e1",
                        "surface-container": "#f0eded",
                        "on-secondary-fixed": "#002108",
                        "outline": "#7f7662",
                        "surface": "#fcf9f8",
                        "tertiary": "#645495",
                        "on-surface-variant": "#4e4634",
                        "secondary-container": "#c5edc4",
                        "on-tertiary-fixed-variant": "#4c3c7c",
                        "on-error-container": "#93000a",
                        "bloom-yellow-soft": "#FFF3C4",
                        "on-secondary": "#ffffff",
                        "bloom-white": "#FFFFFF",
                        "on-background": "#1b1c1c",
                        "outline-variant": "#d1c5ae",
                        "on-secondary-container": "#496d4c",
                        "error": "#ba1a1a",
                        "bloom-cream-dark": "#F5EFE3",
                        "on-tertiary-fixed": "#200d4e",
                        "bloom-amber": "#F5A623",
                        "on-tertiary-container": "#5d4d8e",
                        "primary-container": "#f6c945",
                        "inverse-surface": "#303030",
                        "bloom-red": "#E05C5CD",
                        "on-primary-fixed-variant": "#584400",
                        "on-error": "#ffffff",
                        "bloom-sage-dark": "#4CAF82",
                        "surface-variant": "#e4e2e1",
                        "on-primary": "#ffffff",
                        "surface-bright": "#fcf9f8",
                        "inverse-on-surface": "#f3f0f0",
                        "bloom-cream": "#FFF9F1",
                        "tertiary-container": "#d5c6ff",
                        "tertiary-fixed-dim": "#cebdff",
                        "surface-dim": "#dcd9d9",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#2c4e30",
                        "background": "#fcf9f8",
                        "primary": "#755b00",
                        "secondary-fixed": "#c5edc4",
                        "tertiary-fixed": "#e8ddff",
                        "bloom-red-bg": "#FFECEC",
                        "bloom-night-card": "#272420",
                        "surface-container-low": "#f6f3f2",
                        "on-surface": "#1b1c1c",
                        "on-primary-container": "#6d5400",
                        "inverse-primary": "#eec13e",
                        "bloom-lavender-bg": "#F0ECFF",
                        "bloom-coral": "#FF8A65",
                        "secondary-fixed-dim": "#a9d0a9",
                        "bloom-charcoal-soft": "#5A5A5A",
                        "primary-fixed": "#ffdf90",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#eec13e",
                        "secondary": "#446647",
                        "surface-tint": "#755b00",
                        "bloom-sage-bg": "#EBF5EB",
                        "bloom-night": "#1C1A16",
                        "surface-container-high": "#eae7e7",
                        "on-primary-fixed": "#241a00",
                        "surface-container-lowest": "#ffffff"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px",
                        "card": "20px",
                        "widget": "22px",
                        "mascot": "24px"
                    },
                    spacing: {
                        "gap-card": "10px",
                        "height-bottom-nav": "72px",
                        "gap-section": "20px",
                        "height-status-bar": "44px",
                        "card-padding": "16px",
                        "screen-padding": "20px",
                        "height-top-bar": "56px"
                    },
                    fontFamily: {
                        "micro-label": ["Inter"],
                        "section-heading": ["Sora"],
                        "body-ui": ["Inter"],
                        "screen-title": ["Sora"],
                        "mascot-speech": ["Nunito Sans"],
                        "display-hero": ["Sora"],
                        "stats-lg": ["Sora"],
                        "motivational-quote": ["Nunito Sans"]
                    },
                    fontSize: {
                        "micro-label": ["11px", { lineHeight: "1", letterSpacing: "0.08em", fontWeight: "600" }],
                        "section-heading": ["18px", { lineHeight: "1.4", fontWeight: "600" }],
                        "body-ui": ["15px", { lineHeight: "1.5", fontWeight: "400" }],
                        "screen-title": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                        "mascot-speech": ["14px", { lineHeight: "1.2", fontWeight: "700" }],
                        "display-hero": ["32px", { lineHeight: "1.2", fontWeight: "700" }],
                        "stats-lg": ["28px", { lineHeight: "1", fontWeight: "800" }],
                        "motivational-quote": ["15px", { lineHeight: "1.4", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-bloom-cream text-on-background antialiased min-h-screen flex flex-col items-center justify-center font-body-ui">
<div class="w-full max-w-[390px] min-h-[844px] bg-bloom-cream relative flex flex-col shadow-2xl overflow-hidden mx-auto">
<!-- Top Bar -->
<header class="flex justify-between items-center px-screen-padding h-height-top-bar w-full bg-transparent shrink-0">
<button class="flex items-center text-[#8B8070] font-medium text-[13px] hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined mr-1 text-[16px]">arrow_back</span>
                Back
            </button>
<a class="text-primary-container font-semibold text-[13px] hover:opacity-80 transition-opacity" href="#">
                Create account
            </a>
</header>
<!-- Main Content -->
<main class="flex-1 px-screen-padding flex flex-col pb-screen-padding overflow-y-auto hide-scrollbar">
<!-- Header Section -->
<div class="mt-8 mb-8 flex flex-col items-start">
<div class="w-12 h-12 rounded-mascot bg-bloom-white overflow-hidden mb-4 shadow-sm flex items-center justify-center">
<img alt="Small Sprout mascot waving happily" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ujE3v5hUHYhCPDB2-5hDnxptj0zxlNSCq4qEovHnTz6N6vYmEXSN01Jcd_5PXdu1aszkTf9J8u0E2aW2txy56SuoejlRsJMK8Kdl-xP8i_GR1CbRHZq6K0IeQJ9Y2SxZiU2B8EAL8L9BVC3FDYuS61eHmuVPSlSfMA7p8j6NGgm-z6kcD6Qz34brbYVE24W7W2oRbB0SVmJ35aR6hPxOZXUrx_44soMUsmeN2w_cOPagzQjl3u7QcqmKg"/>
</div>
<h1 class="font-screen-title text-screen-title text-[#2B2B2B] mb-2">Welcome back 🌱</h1>
<p class="font-mascot-speech text-[#8B8070] italic font-semibold">Sprout missed you.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5 flex-1">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-micro-label text-micro-label text-[#B0A898] uppercase" for="email">EMAIL</label>
<div class="relative flex items-center bg-bloom-white rounded-[14px] border-[1.5px] border-[#E8E0D4] h-[52px] px-4 focus-within:border-primary-container transition-colors">
<span class="material-symbols-outlined text-[#8B8070] mr-3">mail</span>
<input class="flex-1 bg-transparent border-none p-0 text-[#2B2B2B] font-medium text-[14px] focus:ring-0 placeholder:text-[#B0A898]" id="email" type="email" value="arjun@gmail.com"/>
<span class="material-symbols-outlined fill text-bloom-sage-dark ml-3">check_circle</span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-micro-label text-micro-label text-[#B0A898] uppercase" for="password">PASSWORD</label>
<div class="relative flex items-center bg-bloom-white rounded-[14px] border-[1.5px] border-[#E8E0D4] h-[52px] px-4 focus-within:border-primary-container transition-colors">
<span class="material-symbols-outlined text-[#8B8070] mr-3">lock</span>
<input class="flex-1 bg-transparent border-none p-0 text-[#2B2B2B] font-medium text-[20px] tracking-widest focus:ring-0 placeholder:text-[#B0A898] pt-2" id="password" type="password" value="......"/>
<button class="text-[#8B8070] hover:text-[#2B2B2B] transition-colors ml-3" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="text-primary-container font-semibold text-[12px] hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-3 mt-1">
<button class="w-10 h-6 bg-primary-container rounded-full p-1 flex items-center transition-colors relative shadow-sm" type="button">
<div class="w-4 h-4 bg-bloom-white rounded-full shadow-sm translate-x-4 transition-transform"></div>
</button>
<span class="text-[#5A5A5A] font-medium text-[13px]">Keep me signed in</span>
</div>
<!-- Sign In Button -->
<button class="w-full h-[56px] bg-primary-container rounded-[16px] text-[#2B2B2B] font-section-heading text-section-heading flex items-center justify-center gap-2 mt-4 hover:opacity-90 active:scale-95 transition-all shadow-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="flex-1 h-[1px] bg-[#E8E0D4]"></div>
<span class="text-[#C8C0B8] text-[12px]">or</span>
<div class="flex-1 h-[1px] bg-[#E8E0D4]"></div>
</div>
<!-- Google Sign In -->
<button class="w-full h-[52px] bg-bloom-white rounded-[14px] border-[1.5px] border-[#E8E0D4] flex items-center justify-center gap-3 hover:bg-[#F5EFE3] active:scale-95 transition-all" type="button">
<!-- Simple Google G SVG representation for structural integrity, avoiding external complex SVGs if possible, but standard G icon requested -->
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.78 15.72 17.56V20.31H19.28C21.36 18.39 22.56 15.58 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.28 20.31L15.72 17.56C14.74 18.22 13.48 18.63 12 18.63C9.13 18.63 6.7 16.69 5.82 14.1H2.15V16.94C3.96 20.54 7.69 23 12 23Z" fill="#34A853"></path>
<path d="M5.82 14.1C5.6 13.43 5.47 12.73 5.47 12C5.47 11.27 5.6 10.57 5.82 9.9V7.06H2.15C1.4 8.56 0.97 10.24 0.97 12C0.97 13.76 1.4 15.44 2.15 16.94L5.82 14.1Z" fill="#FBBC05"></path>
<path d="M12 5.38C13.62 5.38 15.06 5.93 16.2 7.02L19.36 3.86C17.46 2.09 14.97 1 12 1C7.69 1 3.96 3.46 2.15 7.06L5.82 9.9C6.7 7.31 9.13 5.38 12 5.38Z" fill="#EA4335"></path>
</svg>
<span class="text-[#2B2B2B] font-semibold text-[14px]">Continue with Google</span>
</button>
<!-- Biometric Row -->
<div class="flex items-center justify-between mt-2 p-4 bg-bloom-cream-dark rounded-[16px] border-[1px] border-[#E8E0D4] shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-bloom-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[#8B8070]">key</span>
</div>
<span class="text-[#8B8070] font-semibold text-[13px]">Sign in with Fingerprint</span>
</div>
<button class="w-[52px] h-[52px] rounded-full bg-bloom-white border-[1.5px] border-[#E8E0D4] flex items-center justify-center hover:bg-bloom-yellow-soft active:scale-95 transition-all shadow-sm" type="button">
<span class="material-symbols-outlined text-primary-container text-[28px]">fingerprint</span>
</button>
</div>
</form>
<!-- Bottom Link -->
<div class="mt-8 pt-4 pb-2 text-center w-full">
<a class="text-[#B0A898] text-[13px] hover:text-[#8B8070] transition-colors inline-flex items-center gap-1" href="#">
                    Don't have an account? Create one free <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
</a>
</div>
</main>
</div>
</body></html>
