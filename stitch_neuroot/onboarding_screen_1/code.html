<style>
        .particle {
            position: absolute;
            background-color: currentColor;
            border-radius: 50%;
            opacity: 0.08;
        }
        .star {
            position: absolute;
            opacity: 0.08;
            color: currentColor;
        }
        .bg-pattern {
            background-image: radial-gradient(#F5A623 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.1;
        }

<div class="flex items-center gap-2 mb-8">
<div class="w-8 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-surface-dim"></div>
<div class="w-2 h-2 rounded-full bg-surface-dim"></div>

<p class="font-body-ui text-body-ui text-outline text-center max-w-[320px]">

        </p>
</div>
