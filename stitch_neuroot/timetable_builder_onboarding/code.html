<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bloom - Onboarding 3 of 4</title>

            theme: {
                extend: {
                    "colors": {

                        "on-tertiary-fixed": "#200d4e",
                        "primary": "#755b00",
                        "error": "#ba1a1a",
                        "surface-variant": "#e4e2e1",
                        "on-background": "#1b1c1c",
                        "on-error": "#ffffff",
                        "outline": "#7f7662",
                        "on-secondary-fixed": "#002108",
                        "bloom-night-card": "#272420",
                        "primary-container": "#f6c945",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#eec13e",
                        "on-primary-fixed": "#241a00",
                        "bloom-lavender-bg": "#F0ECFF",
                        "secondary-fixed": "#c5edc4",
                        "secondary-container": "#c5edc4",
                        "on-tertiary-container": "#5d4d8e",
                        "bloom-red": "#E05C5CD",
                        "on-secondary-container": "#496d4c",
                        "inverse-surface": "#303030",
                        "bloom-cream": "#FFF9F1",
                        "bloom-sage-bg": "#EBF5EB",
                        "primary-fixed-dim": "#eec13e",
                        "on-error-container": "#93000a",
                        "bloom-yellow-soft": "#FFF3C4",
                        "inverse-on-surface": "#f3f0f0",
                        "surface-dim": "#dcd9d9",

                        "on-surface-variant": "#4e4634",

                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#f0eded",

                        "surface-container-high": "#eae7e7",
                        "bloom-coral": "#FF8A65",

                        "bloom-cream-dark": "#F5EFE3",
                        "surface": "#fcf9f8",
                        "bloom-sage-dark": "#4CAF82",
                        "secondary": "#446647",
                        "bloom-night": "#1C1A16"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "height-status-bar": "44px",
                        "screen-padding": "20px",
                        "gap-card": "10px",
                        "card-padding": "16px",
                        "height-top-bar": "56px",
                        "gap-section": "20px",
                        "height-bottom-nav": "72px"
                    },
                    "fontFamily": {
                        "section-heading": ["Sora", "sans-serif"],
                        "body-ui": ["Inter", "sans-serif"],
                        "display-hero": ["Sora", "sans-serif"],

                    "fontSize": {

                        "motivational-quote": ["15px", {"lineHeight": "1.4", "fontWeight": "700"}],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-bloom-cream text-on-surface font-body-ui min-h-screen flex flex-col max-w-[430px] mx-auto md:shadow-xl md:border md:border-bloom-cream-dark">
<!-- Top Bar (Transactional / Linear flow implies no global nav shell) -->
<header class="flex justify-between items-center w-full px-screen-padding h-height-top-bar shrink-0">
<button class="w-10 h-10 flex items-center justify-start text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex gap-1.5 items-center justify-center">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<button class="w-10 h-10 flex items-center justify-end text-on-surface-variant text-[14px] font-medium hover:opacity-80 transition-opacity">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-screen-padding pb-screen-padding overflow-y-auto overflow-x-hidden">
<!-- Header Section -->
<section class="mt-6 mb-8">
<span class="font-micro-label text-micro-label text-primary uppercase block mb-3 tracking-widest">
                STEP 3 OF 4
            </span>
<h1 class="font-screen-title text-screen-title text-on-surface mb-2">
                Build your timetable
            </h1>
<p class="font-body-ui text-body-ui text-on-surface-variant">
                Add your weekly classes. Color-code by subject.
            </p>
</section>
<!-- Day Tabs -->
<div class="flex overflow-x-auto gap-2 pb-4 -mx-screen-padding px-screen-padding scrollbar-hide mb-2">
<button class="shrink-0 bg-primary-container text-on-surface px-5 py-2.5 rounded-full font-section-heading text-[15px]">
                Mon
            </button>
<button class="shrink-0 bg-bloom-white border border-bloom-cream-dark text-on-surface-variant px-5 py-2.5 rounded-full font-body-ui text-[15px] font-medium">
                Tue
            </button>
<button class="shrink-0 bg-bloom-white border border-bloom-cream-dark text-on-surface-variant px-5 py-2.5 rounded-full font-body-ui text-[15px] font-medium">
                Wed
            </button>
<button class="shrink-0 bg-bloom-white border border-bloom-cream-dark text-on-surface-variant px-5 py-2.5 rounded-full font-body-ui text-[15px] font-medium">
                Thu
            </button>
<button class="shrink-0 bg-bloom-white border border-bloom-cream-dark text-on-surface-variant px-5 py-2.5 rounded-full font-body-ui text-[15px] font-medium">
                Fri
            </button>
<button class="shrink-0 bg-bloom-white border border-bloom-cream-dark text-on-surface-variant px-5 py-2.5 rounded-full font-body-ui text-[15px] font-medium">
                Sat
            </button>
</div>
<!-- Schedule List -->
<div class="flex flex-col gap-gap-card flex-1">
<!-- Class Card 1 -->
<div class="bg-bloom-white rounded-[18px] border border-bloom-cream-dark p-4 flex gap-4 relative overflow-hidden shadow-sm">
<!-- Left Color Bar -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-bloom-coral"></div>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-section-heading text-[15px] text-on-surface">Data Structures</h3>
<div class="flex items-center gap-1.5 text-on-surface-variant text-[12px] font-medium">
<span class="material-symbols-outlined text-[14px]">schedule</span>
                        9:00 AM – 10:30 AM
                    </div>
<div class="flex items-center gap-3 text-outline text-[12px] mt-1">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">location_on</span>
                            Room 204
                        </span>
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">person</span>
                            Prof. Sharma
                        </span>
</div>
</div>
<div class="flex flex-col justify-start items-end">
<span class="bg-[#FFF0E6] text-bloom-coral text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider">
                        DSA
                    </span>
</div>
</div>
<!-- Class Card 2 -->
<div class="bg-bloom-white rounded-[18px] border border-bloom-cream-dark p-4 flex gap-4 relative overflow-hidden shadow-sm">
<!-- Left Color Bar -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-tertiary-container"></div>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-section-heading text-[15px] text-on-surface">Computer Networks</h3>
<div class="flex items-center gap-1.5 text-on-surface-variant text-[12px] font-medium">
<span class="material-symbols-outlined text-[14px]">schedule</span>
                        11:00 AM – 12:30 PM
                    </div>
<div class="flex items-center gap-3 text-outline text-[12px] mt-1">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">location_on</span>
                            Room 108
                        </span>
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">person</span>
                            Prof. Gupta
                        </span>
</div>
</div>
<div class="flex flex-col justify-start items-end">
<span class="bg-tertiary-fixed text-tertiary text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider">
                        CN
                    </span>
</div>
</div>
<!-- Add Class Button -->
<button class="w-full h-14 bg-bloom-cream rounded-[18px] border-[1.5px] border-dashed border-outline-variant flex items-center justify-center text-outline font-body-ui font-semibold text-[14px] hover:bg-bloom-white transition-colors">
                + Add class for Monday
            </button>
</div>
<!-- Bottom CTA -->
<div class="mt-8 pt-4 pb-2 shrink-0">
<button class="w-full h-[56px] bg-primary-container rounded-[16px] text-on-surface font-section-heading text-[16px] flex items-center justify-center gap-2 active:scale-95 transition-transform duration-200">
                Continue <span class="material-symbols-outlined text-[20px]">arrow_forward</span> Almost Done!
            </button>
</div>
</main>
<style>
        /* Utility to hide scrollbar for horizontal scrolling tabs */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
