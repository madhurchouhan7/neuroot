<body class="bg-bloom-cream min-h-screen flex flex-col font-body-ui">
<!-- Top Navigation Area (Transactional/Linear flow -> no standard topbar, custom header instead) -->
<header class="flex justify-between items-center w-full px-screen-padding h-height-top-bar bg-bloom-cream pt-4">
<button class="text-on-surface p-2 -ml-2 rounded-full hover:bg-bloom-cream-dark transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-8 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
<button class="text-on-surface-variant font-body-ui text-body-ui font-medium">
            Skip
        </button>
</header>
<!-- Main Canvas -->
<main class="flex-1 px-screen-padding pb-[120px] max-w-md mx-auto w-full">
<!-- Header Section -->
<section class="mt-6 mb-8 flex flex-col items-center text-center">
<img alt="Sprout mascot looking focused" class="w-[80px] h-[80px] object-contain mb-4 animate-bounce" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBkgJVMoaR_-QpCUz412ZSDt4ReD_578rnJOcYb8zClZg5eZGgtZ0H4ghYACDV1qSs3zX6X0pcID2HZBosYoXp7VOcPs6BzYbAxUt68R7HkLl-GuF2dUYw37N6KmLZ06wS9r8fdDXPB1_b-yu6ajukdE-yR3jLepK6Sp2E88lHojp3nS-ORacSBesxBAFwl1JV4hG1_M-HlLiKn6fzH70e21v0D267lkor3oJxHj-v5mwciL_XILaUGZzxW4zs5r1kI3aJvf72wzLQ" style="animation-duration: 3s;"/>
<div class="bg-bloom-yellow-soft text-primary-container px-3 py-1 rounded-full font-micro-label text-micro-label mb-3 uppercase">
                STEP 2 OF 4
            </div>
<h1 class="font-screen-title text-screen-title text-on-surface mb-2">
                Set up your semester
            </h1>
<p class="font-body-ui text-body-ui text-on-surface-variant">
                Takes under 2 minutes. We promise.
            </p>
</section>
<!-- Form Section -->
<section class="space-y-gap-section flex flex-col">
<!-- Semester Name -->
<div class="flex flex-col gap-2">
<label class="font-section-heading text-[15px] font-semibold text-on-surface">Semester Name</label>
<div class="relative">
<input class="w-full bg-bloom-white border-2 border-bloom-cream-dark rounded-[14px] px-4 py-3 font-body-ui text-on-surface focus:border-primary-container focus:ring-0 transition-colors shadow-sm outline-none" type="text" value="Sem 4 · 2025–26"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-bloom-sage-dark bg-bloom-sage-bg rounded-full p-1">
<span class="material-symbols-outlined text-[16px] font-bold" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Dates Row -->
<div class="flex gap-3">
<div class="flex-1 flex flex-col gap-2">
<label class="font-section-heading text-[15px] font-semibold text-on-surface">Start Date</label>
<div class="relative">
<input class="w-full bg-bloom-white border-2 border-bloom-cream-dark rounded-[14px] px-4 py-3 font-body-ui text-on-surface focus:border-primary-container focus:ring-0 transition-colors shadow-sm outline-none text-[14px]" type="text" value="Jan 06, 2026"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-bloom-sage-dark">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
</div>
</div>
</div>
<div class="flex-1 flex flex-col gap-2">
<label class="font-section-heading text-[15px] font-semibold text-on-surface">End Date</label>
<div class="relative">
<input class="w-full bg-bloom-white border-2 border-bloom-cream-dark rounded-[14px] px-4 py-3 font-body-ui text-on-surface focus:border-primary-container focus:ring-0 transition-colors shadow-sm outline-none text-[14px]" type="text" value="May 20, 2026"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-bloom-sage-dark">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
</div>
</div>
</div>
</div>
<!-- Attendance Threshold -->
<div class="flex flex-col gap-2 pt-2">
<div class="flex justify-between items-end">
<label class="font-section-heading text-[15px] font-semibold text-on-surface">Target Attendance</label>
<span class="text-[12px] text-on-surface-variant">Most require 75%</span>
</div>
<div class="flex gap-3">
<button class="flex-1 py-3 rounded-[14px] bg-primary-container text-on-primary-container font-semibold border-2 border-primary-container shadow-sm transition-transform active:scale-95">
                        75%
                    </button>
<button class="flex-1 py-3 rounded-[14px] bg-bloom-white text-on-surface border-2 border-bloom-cream-dark hover:border-primary-container transition-all active:scale-95">
                        80%
                    </button>
<button class="flex-1 py-3 rounded-[14px] bg-bloom-white text-on-surface border-2 border-bloom-cream-dark hover:border-primary-container transition-all active:scale-95">
                        85%
                    </button>
</div>
</div>
<!-- Subjects (Bento-ish Chip layout) -->
<div class="flex flex-col gap-3 pt-4">
<label class="font-section-heading text-[15px] font-semibold text-on-surface">Subjects</label>
<div class="flex flex-wrap gap-2">
<!-- Chip DSA -->
<div class="bg-bloom-red-bg border border-bloom-red/20 px-4 py-2 rounded-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-bloom-coral"></span>
<span class="font-body-ui text-[14px] font-medium text-on-surface">DSA</span>
</div>
<!-- Chip CN -->
<div class="bg-bloom-lavender-bg border border-tertiary-container px-4 py-2 rounded-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-body-ui text-[14px] font-medium text-on-surface">CN</span>
</div>
<!-- Chip OS -->
<div class="bg-bloom-sage-bg border border-secondary-container px-4 py-2 rounded-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-bloom-sage-dark"></span>
<span class="font-body-ui text-[14px] font-medium text-on-surface">OS</span>
</div>
<!-- Chip EMFT -->
<div class="bg-bloom-yellow-soft border border-primary-fixed px-4 py-2 rounded-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-bloom-amber"></span>
<span class="font-body-ui text-[14px] font-medium text-on-surface">EMFT</span>
</div>
<!-- Chip DBMS -->
<div class="bg-error-container border border-error/20 px-4 py-2 rounded-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="font-body-ui text-[14px] font-medium text-on-surface">DBMS</span>
</div>
<!-- Add Action -->
<button class="border-2 border-dashed border-outline-variant px-4 py-2 rounded-full flex items-center gap-1 hover:bg-bloom-cream-dark transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined text-[16px]">add</span>
<span class="font-body-ui text-[14px] font-medium">Add Subject</span>
</button>
</div>
</div>
</section>
</main>
<!-- Bottom Fixed Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-bloom-cream via-bloom-cream to-transparent pt-10 pb-6 px-screen-padding z-50 pointer-events-none">
<div class="max-w-md mx-auto flex flex-col items-center gap-3 pointer-events-auto">
<button class="w-full bg-primary-container text-on-primary-fixed py-4 rounded-2xl font-screen-title text-[16px] font-bold shadow-[0_4px_14px_rgba(246,201,69,0.3)] hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
                Continue <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="font-micro-label text-micro-label text-on-surface-variant flex items-center gap-1">
<span class="text-bloom-amber text-[14px]">✦</span> You can edit these anytime
            </p>
</div>
</div>
</body></html>
