<body class="bg-bloom-cream text-on-surface font-body-ui min-h-screen antialiased flex flex-col items-center">
<div class="w-full max-w-[390px] min-h-[844px] bg-bloom-cream relative flex flex-col mx-auto shadow-2xl overflow-y-auto">
<!-- Top App Bar - Linear Transactional, hiding navigation shell intent -->
<header class="flex justify-between items-center px-screen-padding h-height-top-bar w-full bg-transparent shrink-0">
<button class="flex items-center gap-1 text-[#8B8070] font-body-ui text-[13px] font-medium hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
                Back
            </button>
<button class="text-primary-container font-body-ui text-[13px] font-semibold hover:opacity-80 transition-opacity">
                Sign in
            </button>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col px-screen-padding pb-[40px] pt-2">
<!-- Header Section -->
<section class="mb-8 flex flex-col items-start gap-4">
<img alt="Sprout mascot waving happily" class="w-12 h-12 rounded-xl object-cover shadow-sm" src="https://lh3.googleusercontent.com/aida/ADBb0ujE3v5hUHYhCPDB2-5hDnxptj0zxlNSCq4qEovHnTz6N6vYmEXSN01Jcd_5PXdu1aszkTf9J8u0E2aW2txy56SuoejlRsJMK8Kdl-xP8i_GR1CbRHZq6K0IeQJ9Y2SxZiU2B8EAL8L9BVC3FDYuS61eHmuVPSlSfMA7p8j6NGgm-z6kcD6Qz34brbYVE24W7W2oRbB0SVmJ35aR6hPxOZXUrx_44soMUsmeN2w_cOPagzQjl3u7QcqmKg"/>
<div>
<h1 class="font-display-hero text-display-hero text-[#2B2B2B] leading-tight mb-2 whitespace-pre-line">Create your
Bloom account 🌱</h1>
<p class="font-body-ui text-body-ui text-[#8B8070]">Free forever. No credit card. Just growth.</p>
</div>
</section>
<!-- Sign Up Form -->
<form class="flex flex-col gap-3 mb-6">
<!-- Field 1: Full Name -->
<div class="flex flex-col gap-1.5">
<label class="font-micro-label text-micro-label text-[#B0A898] uppercase">YOUR NAME</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[#C8C0B8]" style="font-size: 20px;">person</span>
<input class="w-full h-[52px] bg-bloom-white rounded-[14px] border-[1.5px] border-[#E8E0D4] pl-11 pr-4 font-body-ui text-[14px] text-on-surface placeholder-[#C8C0B8] focus:border-primary-container focus:ring-0 transition-colors" placeholder="e.g. Arjun Sharma" type="text"/>
</div>
</div>
<!-- Field 2: Email -->
<div class="flex flex-col gap-1.5">
<label class="font-micro-label text-micro-label text-[#B0A898] uppercase">EMAIL</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[#C8C0B8]" style="font-size: 20px;">mail</span>
<input class="w-full h-[52px] bg-bloom-white rounded-[14px] border-[1.5px] border-[#E8E0D4] pl-11 pr-4 font-body-ui text-[14px] text-on-surface placeholder-[#C8C0B8] focus:border-primary-container focus:ring-0 transition-colors" placeholder="your@email.com" type="email"/>
</div>
</div>
<!-- Field 3: Password -->
<div class="flex flex-col gap-1.5">
<label class="font-micro-label text-micro-label text-[#B0A898] uppercase">PASSWORD</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[#C8C0B8]" style="font-size: 20px;">lock</span>
<input class="w-full h-[52px] bg-bloom-white rounded-[14px] border-[1.5px] border-[#E8E0D4] pl-11 pr-11 font-body-ui text-[14px] text-on-surface placeholder-[#C8C0B8] focus:border-primary-container focus:ring-0 transition-colors" placeholder="Make it strong!" type="password"/>
<button class="absolute right-4 text-[#C8C0B8] hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
</button>
</div>
<div class="flex items-center gap-3 mt-1 px-1">
<div class="flex-1 h-1 bg-[#E8E0D4] rounded-full overflow-hidden">
<div class="h-full bg-bloom-amber w-[66%] rounded-full"></div>
</div>
<span class="font-body-ui text-[11px] font-medium text-bloom-amber">Good</span>
</div>
</div>
<!-- Field 4: College (Optional) -->
<div class="flex flex-col gap-1.5 mt-1">
<div class="flex justify-between items-center">
<label class="font-micro-label text-micro-label text-[#B0A898] uppercase">YOUR COLLEGE (optional)</label>
<button class="font-body-ui text-[12px] font-medium text-[#B0A898] hover:text-on-surface transition-colors" type="button">Skip</button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[#C8C0B8]" style="font-size: 20px;">account_balance</span>
<input class="w-full h-[52px] bg-bloom-white rounded-[14px] border-[1.5px] border-[#E8E0D4] pl-11 pr-4 font-body-ui text-[14px] text-on-surface placeholder-[#C8C0B8] focus:border-primary-container focus:ring-0 transition-colors" placeholder="e.g. IIT Bombay, VIT Pune" type="text"/>
</div>
</div>
</form>
<!-- Divider -->
<div class="flex items-center gap-3 mb-6">
<div class="flex-1 h-px bg-[#E8E0D4]"></div>
<span class="font-body-ui text-[12px] text-[#C8C0B8]">or sign up with</span>
<div class="flex-1 h-px bg-[#E8E0D4]"></div>
</div>
<!-- Google Button -->
<button class="w-full h-[52px] bg-bloom-white rounded-[14px] border-[1.5px] border-[#E8E0D4] flex items-center justify-center gap-3 hover:bg-[#FDFCFB] transition-colors mb-8 shadow-sm">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.8 15.71 17.58V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.71 17.58C14.72 18.24 13.47 18.64 12 18.64C9.16 18.64 6.75 16.73 5.88 14.17H2.19V17.03C4.01 20.64 7.7 23 12 23Z" fill="#34A853"></path>
<path d="M5.88 14.17C5.66 13.51 5.53 12.77 5.53 12C5.53 11.23 5.65 10.49 5.88 9.83V6.97H2.19C1.43 8.48 1 10.18 1 12C1 13.82 1.43 15.52 2.19 17.03L5.88 14.17Z" fill="#FBBC05"></path>
<path d="M12 5.36C13.62 5.36 15.07 5.92 16.21 7.01L19.36 3.86C17.46 2.08 14.97 1 12 1C7.7 1 4.01 3.36 2.19 6.97L5.88 9.83C6.75 7.27 9.16 5.36 12 5.36Z" fill="#EA4335"></path>
</svg>
<span class="font-body-ui text-[14px] font-semibold text-[#2B2B2B]">Continue with Google</span>
</button>
<!-- Primary CTA -->
<button class="w-full h-[56px] bg-primary-container rounded-[16px] flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-md mt-auto">
<span class="font-section-heading text-[15px] font-semibold text-[#2B2B2B]">Create My Account</span>
<span class="material-symbols-outlined text-[#2B2B2B]" style="font-size: 18px;">arrow_forward</span>
</button>
<!-- Footer Text -->
<p class="font-body-ui text-[12px] text-[#C8C0B8] text-center mt-6 px-4">
                By signing up, you agree to our Terms of Service and Privacy Policy.
            </p>
</main>
</div>
</body></html>
