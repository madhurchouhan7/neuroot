<div class="flex items-center">

</div>
<h1 class="font-screen-title text-screen-title text-primary dark:text-primary-fixed-dim">Session Complete</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="px-screen-padding py-8 flex flex-col items-center max-w-md mx-auto">
<!-- Hero Area -->
<div class="mb-6 flex flex-col items-center">
<div class="relative w-64 h-64 mb-6">
<img alt="Celebrating Sprout Mascot" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfzarHds_dTaLWWzdnSQrA7y16WuXFcLLdrxeK5zFCnfcHoey3LrRDKtuAE8isIwDutU9oTZi-r-bFxpTkEi1Yy6AlL80p6cy3ibC-89WgOp9VrFRG8EDuem7ZK3TAgeat7tst3eQI5A_D5Szlk5fr9uarVy0IDF-jiIakckPnVyKvjVUjP5tBPL90iJEwNQaYWqZqRkLvdvy1lQzIBb-X0Fqusdggdfx1zXlwXMdQ59PGknnX_77iL2CjEjrQXxmYVr9et4tkmfA"/>
</div>
<h2 class="font-display-hero text-display-hero text-center text-on-surface">You did it, Arjun! 🌟</h2>
</div>
<!-- Supportive Message -->
<p class="font-motivational-quote text-motivational-quote text-center text-bloom-charcoal-soft mb-8 px-4">
            Sprout is growing strong thanks to your focus. Time for a well-deserved stretch?
        </p>
<!-- Stats Section -->
<div class="w-full bg-bloom-white rounded-[20px] p-card-padding mb-gap-section shadow-sm border border-bloom-cream-dark">
<div class="space-y-4">
<div class="flex items-center space-x-4">
<div class="bg-bloom-yellow-soft p-3 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-bloom-amber">timer</span>
</div>
<div>
<p class="font-section-heading text-section-heading text-on-surface">25 mins focused</p>
<p class="font-micro-label text-micro-label text-bloom-charcoal-soft">CONCENTRATION STREAK</p>
</div>
</div>
<div class="flex items-center space-x-4">
<div class="bg-bloom-sage-bg p-3 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-bloom-sage-dark" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<div>
<p class="font-section-heading text-section-heading text-on-surface">1 tiny water droplet earned</p>
<p class="font-micro-label text-micro-label text-bloom-charcoal-soft">FOR SPROUT'S GARDEN</p>
</div>
</div>
</div>
</div>

<button class="w-full h-[56px] bg-primary-container text-on-primary-container font-screen-title text-[18px] font-semibold rounded-full shadow-sm transition-all active:scale-95">

            </button>
